<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow - Posta Ofisi 💌</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="content-page-body">

    <div class="pixel-bg-elements">
        <div class="float-item" style="top:15%; left:10%;">✉️</div>
        <div class="float-item" style="top:25%; right:15%;">✨</div>
        <div class="float-item" style="top:75%; left:12%;">🌸</div>
        <div class="float-item" style="top:85%; right:8%;">💌</div>
    </div>

    <div class="post-office-wrapper">
        <div class="sedef-status-area">
            <div class="speech-bubble">
                <p id="sedef-say">Mektubun için bir zarf seçerek başlayalım! ✨</p>
            </div>
            <img src="img/glowie.png" alt="Sedef" id="sedef-avatar" class="pixel-avatar">
        </div>

        <div class="main-card">
            <div id="step-1" class="step-box">
                <h2 class="pixel-text">ZARF SEÇ 💌</h2>
                <div class="envelope-options">
                    <div class="env-item" onclick="startForm('Pembe')">💖<span>Pembe</span></div>
                    <div class="env-item" onclick="startForm('Mavi')">💙<span>Mavi</span></div>
                    <div class="env-item" onclick="startForm('Klasik')">✉️<span>Klasik</span></div>
                </div>
            </div>

            <div id="step-2" class="step-box hidden">
                <form id="glow-form">
                    <div class="input-field">
                        <label>BİR TAKMA AD GİR</label>
                        <input type="text" name="alias" id="alias-input" placeholder="Nasıl görünmek istersin?" required>
                    </div>

                    <input type="hidden" id="hidden-real-name" name="real_identity">

                    <div class="input-field">
                        <label>MESAJIN</label>
                        <textarea name="message" id="message-input" placeholder="Notunu buraya yaz..." required></textarea>
                    </div>

                    <div class="file-upload-box">
                        <input type="file" id="real-file-input" name="attachment" accept="image/*" hidden>
                        <label for="real-file-input" class="custom-file-btn">
                            <span class="btn-icon">📸</span>
                            <span id="file-label-text">FOTOĞRAF EKLE</span>
                        </label>
                    </div>

                    <button type="submit" class="send-letter-btn"> GÖNDER 🚀</button>
                </form>
            </div>

            <div id="step-3" class="step-box hidden">
                <h2 class="pixel-text">GÖNDERİLDİ! ✨</h2>
                <p>Mektubun uçtu! En kısa sürede okuyacağım. ❤️</p>
                <button onclick="window.location.href='menu.html'" class="pixel-main-btn" style="margin-top:20px;">GERİ DÖN</button>
            </div>
        </div>
    </div>

    <script>
        // Sayfa yüklendiğinde localStorage'daki gerçek ismi gizli alana doldurur
        document.addEventListener('DOMContentLoaded', () => {
            const realName = localStorage.getItem('userName') || 'Bilinmiyor';
            document.getElementById('hidden-real-name').value = realName;
        });

        function startForm(env) {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            document.getElementById('sedef-say').innerText = `${env} zarf! Harika seçim.`;
        }

        const fileInput = document.getElementById('real-file-input');
        fileInput.onchange = () => {
            if (fileInput.files.length > 0) {
                document.getElementById('file-label-text').innerText = fileInput.files[0].name;
                document.getElementById('sedef-say').innerText = "Bu fotoğraf mektuba çok yakışacak! ✨";
            }
        };

        const form = document.getElementById('glow-form');
        form.onsubmit = async (e) => {
    e.preventDefault();
    document.getElementById('sedef-say').innerText = "Mektubu güvenli kanalla uçuruyorum... ✨";
    
    const realName = localStorage.getItem('userName') || 'Bilinmiyor';
    const formData = new FormData(form);

    // KRİTİK EKSİK: Backend'in bunun bir mektup olduğunu anlaması için:
    formData.append('type', 'mektup'); 
    formData.append('real_identity', realName);

    try {
        const response = await fetch('/api/send', {
            method: 'POST',
            body: formData
        });

        if (response.ok) {
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-3').classList.remove('hidden');
            document.getElementById('sedef-say').innerText = "Teslim edildi! ✨";
        } else {
            const errorData = await response.json();
            alert("Hata: " + errorData.message);
        }
    } catch (error) {
        alert("Bağlantı hatası!");
    }
};
    </script>
</body>
</html>
