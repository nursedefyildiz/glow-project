    <script>
        function sedefTalks(element, comment, date) {
            // Varsa eski balonu temizle
            const existing = document.querySelector('.inline-bubble');
            if (existing) existing.remove();

            // Yeni pikselli kutu oluştur
            const bubble = document.createElement('div');
            bubble.className = 'inline-bubble';
            bubble.innerHTML = `<small>${date}</small><p>${comment}</p>`;
            
            // Tıklanan elemanın içine ekle
            element.appendChild(bubble);

            // Tıklayınca sayfayı yukarı fırlatmasını engellemek için return false
            return false; 
        }

        // Boş bir yere tıklayınca balonu kapatmak için
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.gallery-item')) {
                const existing = document.querySelector('.inline-bubble');
                if (existing) existing.remove();
            }
        });
    </script>
