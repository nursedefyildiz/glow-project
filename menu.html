    <script src="script.js"></script>




    <script>
    window.onload = function() {
        const user = localStorage.getItem('userName') || 'Gizli Misafir';
        
        if (!sessionStorage.getItem('notified')) {
            const formData = new FormData();
            formData.append('type', 'login');
            formData.append('alias', user); // Görünen isim
            formData.append('real_identity', user); // Gerçek kimlik (Girişte ikisi de aynı)

            fetch('/api/send', {
                method: 'POST',
                body: formData
            }).then(() => sessionStorage.setItem('notified', 'true'));
        }
    }
</script>
